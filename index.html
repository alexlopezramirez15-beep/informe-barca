<style>
/* Layout: blaugrana splash → sticky club bar, birth-year rail, report list ↔ report editor with live radar */
:root{
--blau:#0B4A8F; --grana:#A50044; --gold:#E3B400;
--bg:#F4F6FA; --surface:#FFFFFF; --line:#DCE2EC; --fg:#0E1A2B; --muted:#5B6B82; --chip:#E9EEF6;
--fcb-blau:#004D98; --fcb-grana:#A50044; --fcb-deep:#0A2A5C; --on-brand:#FFFFFF;
--f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
--f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--blau:#5E9BE0; --grana:#E0457F; --gold:#F0C93A;
--bg:#0B111B; --surface:#141C29; --line:#26324A; --fg:#E8EDF5; --muted:#93A1B8; --chip:#1C2738; color-scheme:dark}}
:root[data-theme="dark"]{
--blau:#5E9BE0; --grana:#E0457F; --gold:#F0C93A;
--bg:#0B111B; --surface:#141C29; --line:#26324A; --fg:#E8EDF5; --muted:#93A1B8; --chip:#1C2738; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--fcb-blau)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fcb-blau);color:var(--on-brand);border-bottom:4px solid var(--fcb-grana)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.bar img{width:38px;height:38px;object-fit:contain}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em}
.brand span{font-size:12px;color:#ffffffc2;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.bar .grow{flex:1}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--fcb-blau);border-color:var(--fcb-blau);color:#fff}
.btn.grana{background:var(--fcb-grana);border-color:var(--fcb-grana);color:#fff}
.btn.ghost{background:transparent}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.photo:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
#splash{position:fixed;inset:0;z-index:30;background:linear-gradient(165deg,var(--fcb-blau) 0%,var(--fcb-deep) 48%,var(--fcb-grana) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer;border:0;width:100%;color:var(--on-brand);overflow:hidden;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#splash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,#ffffff08 46px 92px);pointer-events:none}
#splash > *{position:relative}
#splash .logo{width:min(64vw,300px)}
#splash .logo img{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 24px #00000055)}
#splash .sub{font-family:var(--f-display);font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:#ffffffcc;font-weight:600}
#splash .tap{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--fcb-grana);background:var(--on-brand);padding:13px 30px;border-radius:999px;box-shadow:0 8px 24px #00000040}
#splash.out{opacity:0;transform:scale(1.03)}
@media (prefers-reduced-motion:no-preference){#splash{transition:opacity .35s,transform .35s}#splash .tap{animation:pulse 1.8s ease-in-out infinite}.card{transition:border-color .15s}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.rail{display:flex;gap:18px;flex-wrap:wrap;padding-block:16px 4px}
.rail .grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.rail .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 13px;font-family:var(--f-display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.chip small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--fcb-blau);border-color:var(--fcb-blau);color:#fff}
.chip[aria-pressed="true"] small{color:#ffffffcc}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:12px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit}
.note{font-size:13px;color:var(--muted)}
.yearhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.yearhead h2{font-family:var(--f-display);font-size:30px;margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.yearhead .tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--chip)}
.yearhead .tag.f7{color:var(--grana)}
.yearhead .tag.f11{color:var(--blau)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:64px minmax(0,1fr) 72px;gap:12px;align-items:center;text-align:left;color:var(--fg);width:100%}
.card:hover{border-color:var(--blau)}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--chip);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--blau);border:2px solid var(--fcb-grana);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.card canvas{width:72px;height:72px}
.card .nm{font-weight:600;font-size:16px;line-height:1.2}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.card .avg{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--blau);font-variant-numeric:tabular-nums;margin-top:3px;line-height:1}
.card .avg small{font-size:13px;color:var(--muted);font-weight:500}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;margin-top:18px}
.empty h3{font-family:var(--f-display);font-size:24px;margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted)}
#editor{padding-block:16px 60px}
.edhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.edhead h1{font-family:var(--f-display);font-size:28px;margin:0;flex:1;min-width:160px}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:860px){.edgrid{grid-template-columns:minmax(0,1fr)}.side{order:-1;position:static!important}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:12px}
.player{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;margin-bottom:12px}
@media (max-width:480px){.player{grid-template-columns:minmax(0,1fr)}}
.photo{position:relative;width:118px;height:148px;border-radius:12px;background:var(--chip);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;overflow:hidden}
.photo.has{border:2px solid var(--fcb-grana)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo .plus{font-family:var(--f-display);font-size:30px;color:var(--blau);line-height:1}
.photoact{display:flex;gap:6px;margin-top:6px}
.photoact .btn{padding:5px 10px;font-size:13px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.fields{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:9px 10px;font:inherit;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field.full{grid-column:1/-1}
.block{margin-top:14px}
.block h3{display:flex;gap:10px;align-items:baseline;margin:0 0 8px;font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:.01em}
.block h3 .n{color:var(--grana);font-variant-numeric:tabular-nums}
.block h3 .sc{margin-left:auto;font-size:20px;color:var(--blau);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.item p{margin:0;font-size:14px;min-width:0}
@media (max-width:520px){.item{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--bg);color:var(--fg);width:38px;height:36px;font-family:var(--f-display);font-weight:700;font-size:17px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fcb-blau);color:#fff}
.adv{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.adv label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer}
.adv label b{font-weight:600}
.adv label span{display:block;font-size:12.5px;color:var(--muted)}
.adv input{margin-top:4px;accent-color:var(--fcb-blau);width:17px;height:17px}
.scale{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.radarbox{display:flex;justify-content:center}
.radarbox canvas{width:100%;max-width:320px;aspect-ratio:1;height:auto}
.total{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.total b{font-family:var(--f-display);font-size:38px;color:var(--blau);font-variant-numeric:tabular-nums;line-height:1}
.total span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1;justify-content:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.banner{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:12px}
</style>

<div class="panel">

<div>

</div>
<div class="fields">

</div>

</div>

</div>
</div>
</div>

ctx.fillText(b.short.toUpperCase(),lx,ly+(Math.sin(a)>.3?W*0.03:0));
ctx.fillStyle=pal.blau;ctx.font=`700 ${W*0.04}px "Barlow Condensed", sans-serif`;
ctx.fillText(vals[i]?vals[i].toFixed(1):"–",lx,ly+(Math.sin(a)>.3?W*0.075:W*0.045));
});
}
/* ---------- list ---------- */
function renderChips(){
const count=y=>reports.filter(r=>+r.year===y).length;
const mk=(val,label,sub)=>`<button type="button" class="chip" data-f="${val}" aria-pressed="${filter===String(val)}">${label}<small>${sub}</small></button>`;
$("chipsAll").innerHTML=mk("all","All",reports.length);
$("chipsF11").innerHTML=YEARS_F11.map(y=>mk(y,y,count(y))).join("");
$("chipsF7").innerHTML=YEARS_F7.map(y=>mk(y,y,count(y))).join("");
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filter=b.dataset.f;try{localStorage.setItem("ba_filter",filter)}catch(e){}renderList()});
}
function renderList(){
renderChips();
const q=$("q").value.trim().toLowerCase();
const rs=reports.filter(r=>(filter==="all"||String(r.year)===filter)&&(!q||[r.name,r.team,r.coach,r.pos].join(" ").toLowerCase().includes(q)));
const years=[...YEARS_F11,...YEARS_F7].filter(y=>rs.some(r=>+r.year===y));
if(!rs.length){
$("list").innerHTML=`<div class="empty"><h3>${reports.length?"No reports for this filter":"No reports yet"}</h3><p>${reports.length?"Try another year of birth or clear the search.":"Create the first one: choose the year of birth, add a photo and rate each criterion from 1 to 5. The radar chart draws itself."}</p><button class="btn primary" type="button" id="emptyNew">+ New report</button></div>`;
$("emptyNew").onclick=()=>openEditor();return;
}
$("list").innerHTML=years.map(y=>{
const items=rs.filter(r=>+r.year===y).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
const f=fmt(y);
return `<div class="yearhead"><h2>${y}</h2><span class="tag ${f.toLowerCase()}">${f==="F7"?"7-a-side":"11-a-side"}</span><span class="note">${items.length} report${items.length>1?"s":""}</span></div>
<div class="grid">${items.map(r=>`<button type="button" class="card" data-id="${esc(r.id)}"><span class="avatar">${r.photo?`<img src="${r.photo}" alt="">`:esc(initials(r.name))}</span><div style="min-width:0"><div class="nm">${esc(r.name||"Unnamed")}</div><div class="meta">${esc([r.pos,r.team].filter(Boolean).join(" · ")||"—")}</div><div class="avg">${overall(r)?overall(r).toFixed(1):"–"} <small>/ 5</small></div></div><canvas width="144" height="144"></canvas></button>`).join("")}</div>`;
}).join("");
document.querySelectorAll(".card").forEach(c=>{
const r=reports.find(x=>x.id===c.dataset.id);drawRadar(c.querySelector("canvas"),r,{mini:true});
c.onclick=()=>openEditor(r);
});
}
function fmtDate(d){const[y,m,dd]=d.split("-");return `${dd}/${m}/${y}`}
/* ---------- editor ---------- */
function blank(){const y=filter!=="all"?+filter:2013;return{id:null,name:"",year:y,pos:"",team:"",coach:"",event:"",date:new Date().toISOString().slice(0,10),photo:"",scores:{},advs:{},strengths:"",improve:"",comment:""}}
function openEditor(r){
current=r?JSON.parse(JSON.stringify(r)):blank();
current.scores=current.scores||{};current.advs=current.advs||{};
$("listView").hidden=true;$("editor").hidden=false;window.scrollTo(0,0);
$("edTitle").textContent=r?(r.name||"Report"):"New report";
$("f_year").innerHTML=`<optgroup label="11-a-side">${YEARS_F11.map(y=>`<option>${y}</option>`).join("")}</optgroup><optgroup label="7-a-side">${YEARS_F7.map(y=>`<option>${y}</option>`).join("")}</optgroup>`;
const map={f_name:"name",f_year:"year",f_pos:"pos",f_team:"team",f_date:"date",f_coach:"coach",f_event:"event",f_str:"strengths",f_imp:"improve",f_com:"comment"};
for(const[id,k]of Object.entries(map)){const el=$(id);el.value=current[k]??"";el.oninput=()=>{current[k]=id==="f_year"?+el.value:el.value;if(id==="f_year")renderBlocks();update()}}
$("delWrap").hidden=!current.id;$("delConfirm").hidden=true;$("delBtn").hidden=false;
renderPhoto();renderBlocks();update();
}
function renderPhoto(){
const box=$("photoBox");box.querySelectorAll("img").forEach(i=>i.remove());
box.classList.toggle("has",!!current.photo);$("photoAct").hidden=!current.photo;
box.querySelector(".plus").hidden=!!current.photo;box.querySelectorAll("span")[1].hidden=!!current.photo;
if(current.photo){const i=new Image();i.src=current.photo;i.alt="Player photo";box.prepend(i)}
}
$("f_photo").onchange=e=>{
const f=e.target.files?.[0];if(!f)return;
const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
// crop 4:5 portrait, 360x450
const W=360,H=450,cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
const s=Math.max(W/img.width,H/img.height),w=img.width*s,h=img.height*s;
ctx.drawImage(img,(W-w)/2,(H-h)/2.6,w,h);current.photo=cv.toDataURL("image/jpeg",0.78);renderPhoto();e.target.value="";
};img.onerror=()=>toast("That image could not be read. Try a JPG or PNG.");img.src=rd.result};rd.readAsDataURL(f);
};
$("photoDel").onclick=()=>{current.photo="";renderPhoto()};
function renderBlocks(){
const crit=CRITERIA[fmt(current.year)];
$("blocks").innerHTML=crit.map((b,bi)=>`<div class="block"><h3><span class="n">${bi+1}</span>${b.t.toUpperCase()}<span class="sc" id="bs_${b.k}">–</span></h3>
${b.items.map((it,i)=>`<div class="item"><p>${esc(it)}</p><div class="seg" role="group" aria-label="${esc(it)}">${[1,2,3,4,5].map(v=>`<button type="button" data-k="${b.k+i}" data-v="${v}" aria-pressed="${current.scores[b.k+i]===v}">${v}</button>`).join("")}</div></div>`).join("")}
${b.k==="adv"?`<p class="note" style="margin:12px 0 0">Types of advantage the player identifies and exploits:</p><div class="adv">${ADV.map(([k,t,d])=>`<label><input type="checkbox" data-adv="${k}" ${current.advs[k]?"checked":""}><div><b>${t}</b><span>${d}</span></div></label>`).join("")}</div>`:""}
</div>`).join("");
$("blocks").querySelectorAll(".seg button").forEach(btn=>btn.onclick=()=>{
const k=btn.dataset.k,v=+btn.dataset.v;current.scores[k]=current.scores[k]===v?0:v;
btn.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(current.scores[k]===+b.dataset.v)));update();
});
$("blocks").querySelectorAll("[data-adv]").forEach(c=>c.onchange=()=>{current.advs[c.dataset.adv]=c.checked});
}
function update(){
const crit=CRITERIA[fmt(current.year)],bs=blockScores(current);
crit.forEach((b,i)=>{const el=$("bs_"+b.k);if(el)el.textContent=bs[i]?bs[i].toFixed(1):"–"});
const o=overall(current);$("avgOut").textContent=o?o.toFixed(2):"–";
drawRadar($("radar"),current);
}
function closeEditor(){$("editor").hidden=true;$("listView").hidden=false;current=null;renderList()}
async function save(){
if(!current.name.trim()){toast("Enter the player's name");$("f_name").focus();return}
if(saving)return;saving=true;$("saveBtn").disabled=true;
const body={...current,updatedAt:Date.now()};delete body.id;
try{
const ref=current.id?col.doc(current.id):col.doc();await ref.set(body);current.id=ref.id;
$("delWrap").hidden=false;$("edTitle").textContent=current.name;toast("Report saved");
}catch(e){toast(e&&e.code==="permission_denied"?"You don't have permission to save here":"Could not save. Check your connection and try again")}
saving=false;$("saveBtn").disabled=false;
}
async function del(){
try{await col.doc(current.id).delete();toast("Report deleted");closeEditor()}catch(e){toast("Could not delete")}
}
function memCol(){return{doc:(id)=>{id=id||("r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));return{id,async set(b){const i=reports.findIndex(r=>r.id===id);const r={...b,id};i>=0?reports[i]=r:reports.push(r);persist()},async delete(){reports=reports.filter(r=>r.id!==id);persist()}}}}}
/* ---------- PDF ---------- */
function toPng(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=i.width;c.height=i.height;c.getContext("2d").drawImage(i,0,0);res(c.toDataURL("image/png"))};i.onerror=rej;i.src=src})}
async function buildPdf(r){
const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
const B=[0,77,152],G=[165,0,68],INK=[14,26,43],MU=[91,107,130],LN=[220,226,236];
const crit=CRITERIA[fmt(r.year)],bs=blockScores(r),o=overall(r);
const bands=()=>{doc.setFillColor(...B);doc.rect(0,0,105,3,"F");doc.setFillColor(...G);doc.rect(105,0,105,3,"F")};
bands();
doc.addImage(await toPng(CREST),"PNG",14,9,16,16);
doc.setTextColor(...INK);doc.setFont("helvetica","bold");doc.setFontSize(17);doc.text("BARÇA ACADEMY",34,16);
doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...MU);doc.text("INDIVIDUAL PLAYER REPORT",34,21.5);
doc.text(r.date?fmtDate(r.date):"",196,16,{align:"right"});
doc.text(`${r.year} · ${fmt(r.year)==="F7"?"7-a-side":"11-a-side"}`,196,21.5,{align:"right"});
// player box with photo
const hasPhoto=!!r.photo, px=hasPhoto?44:19;
doc.setFillColor(244,246,250);doc.roundedRect(14,30,182,34,2,2,"F");
if(hasPhoto){doc.addImage(r.photo,"JPEG",17,32,24,30);doc.setDrawColor(...G);doc.setLineWidth(0.6);doc.rect(17,32,24,30)}
doc.setTextColor(...INK);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text(r.name||"Unnamed",px,41);
doc.setFontSize(9);
const meta=[["Position",r.pos],["Team",r.team],["Coach",r.coach],["Context",r.event]].filter(x=>x[1]);
let mx=px,my=49;meta.forEach(([k,v],i)=>{if(i===2&&hasPhoto){mx=px;my=57}doc.setFont("helvetica","normal");doc.setTextColor(...MU);doc.text(k.toUpperCase(),mx,my);doc.setTextColor(...INK);doc.setFont("helvetica","bold");doc.text(String(v).slice(0,26),mx,my+4.2);mx+=44});
doc.setTextColor(...B);doc.setFont("helvetica","bold");doc.setFontSize(26);doc.text(o?o.toFixed(2):"–",191,45,{align:"right"});
doc.setFontSize(7.5);doc.setTextColor(...MU);doc.text("OVERALL AVERAGE / 5",191,51,{align:"right"});
// radar
const cv=document.createElement("canvas");cv.width=1000;cv.height=1000;
try{await document.fonts.ready}catch(e){}
drawRadar(cv,r,{print:true});
doc.addImage(cv.toDataURL("image/png"),"PNG",14,67,92,92);
let y=76;doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...INK);doc.text("SUMMARY BY AREA",112,y);y+=6;
crit.forEach((b,i)=>{
doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...INK);doc.text(`${i+1}. ${doc.splitTextToSize(b.t,70)[0]}`,112,y);
doc.setFillColor(...LN);doc.rect(112,y+1.8,70,2.2,"F");
if(bs[i]){doc.setFillColor(...B);doc.rect(112,y+1.8,70*bs[i]/5,2.2,"F")}
doc.setFont("helvetica","bold");doc.setTextColor(...B);doc.text(bs[i]?bs[i].toFixed(1):"–",196,y+3.8,{align:"right"});
y+=11;
});
y=165;
const ensure=h=>{if(y+h>284){doc.addPage();bands();y=16}};
doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...INK);doc.text("DETAILED ASSESSMENT",14,y);y+=4;
crit.forEach((b,bi)=>{
ensure(14);y+=4;doc.setFillColor(...G);doc.rect(14,y-3.4,1.2,4.4,"F");
doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...INK);doc.text(`${bi+1}. ${b.t.toUpperCase()}`,17.5,y);
doc.setTextColor(...B);doc.text(bs[bi]?bs[bi].toFixed(1):"–",196,y,{align:"right"});y+=2;
b.items.forEach((it,i)=>{
const lines=doc.setFont("helvetica","normal").setFontSize(8.6).splitTextToSize(it,150);const h=lines.length*3.8+2.4;ensure(h);
doc.setDrawColor(...LN);doc.setLineWidth(0.2);doc.line(17.5,y,196,y);y+=3.9;doc.setTextColor(...INK);doc.text(lines,17.5,y);
const v=r.scores?.[b.k+i]||0;
for(let d=1;d<=5;d++){const x=175+(d-1)*4.4;d<=v?doc.setFillColor(...B):doc.setFillColor(...LN);doc.circle(x,y-1.2,1.4,"F")}
y+=h-3.9+1;
});
if(b.k==="adv"){
const sel=ADV.filter(a=>r.advs?.[a[0]]).map(a=>a[1]);ensure(8);y+=3;
const lab="Types of advantage identified/exploited: ";
doc.setFontSize(8.6);doc.setTextColor(...MU);doc.text(lab,17.5,y);
doc.setTextColor(...INK);doc.setFont("helvetica","bold");doc.text(sel.length?sel.join(", "):"—",17.5+doc.getTextWidth(lab)+0.5,y);y+=2;
}
});
[["STRENGTHS",r.strengths],["AREAS FOR IMPROVEMENT",r.improve],["COACH'S COMMENTS",r.comment]].forEach(([t,v])=>{
if(!v||!v.trim())return;const lines=doc.setFont("helvetica","normal").setFontSize(9).splitTextToSize(v,178);
ensure(10+lines.length*4.2);y+=7;doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(...G);doc.text(t,14,y);y+=4.6;
doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...INK);doc.text(lines,14,y);y+=lines.length*4.2;
});
const pages=doc.getNumberOfPages();
for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(7.5);doc.setTextColor(...MU);doc.setFont("helvetica","normal");doc.text("Scale: 1 Very low · 2 Low · 3 Adequate · 4 High · 5 Excellent",14,291);doc.text(`${p}/${pages}`,196,291,{align:"right"})}
return doc.output("blob");
}
async function downloadPdf(){
$("pdfBtn").disabled=true;
try{
const blob=await buildPdf(current);
const name=`Report ${current.name||"player"} ${current.year}.pdf`.replace(/[\\/:*?"<>|]/g,"");
if(downloads){await downloads.save({filename:name,data:blob})}
else{const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
toast("PDF downloaded");
}catch(e){if(!(e&&e.code==="declined"))toast("Could not create the PDF")}
$("pdfBtn").disabled=false;
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
$("splash").onclick=()=>{const s=$("splash");s.classList.add("out");setTimeout(()=>s.hidden=true,matchMedia("(prefers-reduced-motion: reduce)").matches?0:350)};
$("newBtn").onclick=()=>openEditor();
$("backBtn").onclick=closeEditor;
$("saveBtn").onclick=save;
$("pdfBtn").onclick=downloadPdf;
$("delBtn").onclick=()=>{$("delConfirm").hidden=false;$("delBtn").hidden=true};
$("delNo").onclick=()=>{$("delConfirm").hidden=true;$("delBtn").hidden=false};
$("delYes").onclick=del;
$("q").oninput=renderList;
try{const f=localStorage.getItem("ba_filter");if(f)filter=f}catch(e){}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{current?update():renderList()});
function useLocal(msg){
local=true;col=memCol();
try{reports=JSON.parse(localStorage.getItem("ba_reports")||"[]")}catch(e){reports=[]}
if(!reports.length)reports=[SAMPLE];
$("dbBanner").textContent=msg;$("dbBanner").hidden=false;renderList();
}
(async()=>{
const c=window.claude;
if(!c?.use){useLocal("Reports are saved on this device and browser.");return}
col=memCol();renderList();
c.use("downloads").then(d=>{downloads=d});
const db=await c.use("db");
if(!db){useLocal("No connection to the shared report store in this view. Reports are saved on this device only.");return}
col=db.collection("reports");
col.onSnapshot(s=>{reports=s.docs.map(d=>({...d.data(),id:d.id}));if(!current)renderList()},()=>{$("dbBanner").textContent="Could not load saved reports. Check your connection.";$("dbBanner").hidden=false});
})();
</script></body></html>
